<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - تسجيل الدخول</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; padding: 50px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007BFF; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        #result { margin-top: 15px; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
        <div id="result"></div>
    </div>

    <script>
        // قائمة المستخدمين المصرح لهم بالدخول
        const validUsers = [
            { email: "asmaa.ashraf.1312002@gmail.com", password: "Asmaa@2026", name: "Asmaa Ashraf" },
            { email: "ahmedashraf88513@gmail.com", password: "AhmedA#88", name: "Ahmed Ashraf" },
            { email: "ahmedwanas11@gmail.com", password: "Wanas!Pass2026", name: "Ahmed Wanas" },
            { email: "sales1@roving.com", password: "SalesRoving#1", name: "Sales Agent 1" }
        ];

        function login() {
            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const resultDiv = document.getElementById('result');

            // البحث عن المستخدم في القائمة
            const user = validUsers.find(u => u.email === emailInput && u.password === passwordInput);

            if (user) {
                resultDiv.style.color = 'green';
                resultDiv.innerText = 'تم تسجيل الدخول بنجاح! جاري التحويل...';
                
                localStorage.setItem('user', JSON.stringify(user));

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                resultDiv.style.color = 'red';
                resultDiv.innerText = 'خطأ: البريد الإلكتروني أو كلمة المرور غير صحيحة';
            }
        }
    </script>

</body>
</html>
